<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Baseline metadata. Each route overrides title/description/canonical/OG
      at runtime through <Seo>, and the build regenerates the same tags into
      prerendered HTML. These defaults matter for the crawlers that read the
      raw shell before any script executes.
    -->
    <title>IMMO BURUNDI | Achat et location immobilière au Burundi</title>
    <meta
      name="description"
      content="IMMO BURUNDI : achetez et louez des maisons, villas, appartements, terrains et commerces à Bujumbura et dans les 18 provinces du Burundi. Prix en BIF, annonces vérifiées, contact direct avec l'agent."
    />
    <meta name="theme-color" content="#0B5FFF" />
    <meta name="author" content="IMMO BURUNDI" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/assets/brand/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:site_name" content="IMMO BURUNDI" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_BI" />
    <meta property="og:title" content="IMMO BURUNDI | Achat et location immobilière au Burundi" />
    <meta
      property="og:description"
      content="Achat, location et vente de propriétés au Burundi. Maisons, villas, terrains et commerces à Bujumbura et dans les 18 provinces."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IMMO BURUNDI | Achat et location immobilière au Burundi" />
    <meta
      name="twitter:description"
      content="Achat, location et vente de propriétés au Burundi. Maisons, villas, terrains et commerces à Bujumbura et dans les 18 provinces."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Inter:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
