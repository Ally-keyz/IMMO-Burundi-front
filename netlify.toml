# Netlify deployment for this repo (IMMO-Burundi-front).
#
# Set these in Netlify → Site settings → Environment variables (and mirror them
# in the Netlify UI for production deploys):
#   VITE_SITE_URL      = https://immoburundi.netlify.app (required, drives canonical/OG/sitemap)
#   SEO_API_BASE       = https://<api-host>/api
#   SEO_FETCH_API      = 1
#
# @immo/shared-types is vendored under packages/ as a workspace package and
# must be compiled before Vite bundles it (dist/ is gitignored).

[build]
  base = "."
  # pnpm comes from corepack, never from `npm install --global pnpm`. Netlify's
  # pre-build install stage already runs `corepack enable`, which writes a pnpm
  # shim into the Node bin dir; a global npm install then aborts the whole build
  # with "npm error EEXIST: file already exists ... /bin/pnpm" (exit code 2).
  # `corepack enable` is idempotent and picks the version from the
  # `packageManager` field, so this stays a no-op when the shim is already there.
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @immo/shared-types build && pnpm run build"
  publish = "dist"

[build.environment]
  # Keep the toolchain in lockstep with package.json engines and .node-version.
  NODE_VERSION = "20.18.1"

  # Netlify migrated this site to the `noble-new-builds` image, which added an
  # "Install dependencies" stage that runs BEFORE build.command. That stage sees
  # pnpm-workspace.yaml, prints "pnpm workspaces detected", and installs pnpm
  # through corepack — so a break in corepack kills the deploy before any of
  # our code runs, and nothing set inside build.command can rescue it.
  #
  # Two independent corepack problems had to be handled:
  #
  # 1. Signature keys. The corepack bundled with Node 20.18.1 only holds the
  #    pre-rotation npm signing keys and aborts with "Cannot find matching
  #    keyid". Disabling the redundant signature check lets it proceed; the
  #    lockfile still pins every tarball by sha512 under --frozen-lockfile.
  #
  # 2. The pnpm binary path. Corepack up to 0.34.3 hardcodes `bin/pnpm.cjs`
  #    instead of reading pnpm's `bin` field (nodejs/corepack#775). pnpm 11
  #    moved that to `bin/pnpm.mjs` and pnpm 12 (a Rust rewrite) moved it to
  #    the package root, so this corepack can never start them — it fails with
  #    "Cannot find module .../bin/pnpm.cjs". pnpm 10 still ships
  #    `bin/pnpm.cjs`, which is why the project is pinned to the 10.x line.
  #    pnpm 12 also requires Node 22.13+ even to install via npm.
  #
  # `npm install --global pnpm` is NOT a valid fallback: that install stage has
  # already left a corepack shim at the same path, so npm aborts with EEXIST.
  COREPACK_INTEGRITY_KEYS = "0"
  PNPM_VERSION = "10.34.6"

  # Netlify's post-build secret scanner fails the deploy when the value of any
  # env var set in the dashboard also appears in a repo file or in the build
  # output. The vars below are PUBLIC origins, not credentials: VITE_* values
  # are inlined into the client bundle by design and are readable by every
  # visitor. They legitimately appear in netlify.toml, .env.example and the
  # SEO config, so they are declared here to stop the scanner treating them as
  # leaked secrets. Nothing genuinely confidential is listed — JWT secrets,
  # Mongo URIs and the like stay in the Render service only.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SITE_URL,SEO_API_BASE,VITE_API_BASE_URL,VITE_UPLOADS_BASE_URL,VITE_API_PROXY_TARGET"

[dev]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @immo/shared-types build && pnpm run dev"
  targetPort = 5173
  port = 5173
  autoLaunch = false

# ── Backend reverse proxy ────────────────────────────────────────────────
# The app targets a same-origin /api, /uploads and /socket.io (see
# src/lib/runtime.ts). Forwarding them to the API keeps CORS out of the
# browser entirely and lets images and the realtime channel work unchanged.
#
# Leave VITE_API_BASE_URL unset while these rules are active. If you would
# rather hit the API directly, delete these three blocks and set
# VITE_API_BASE_URL + VITE_UPLOADS_BASE_URL instead.
[[redirects]]
  from = "/api/*"
  to = "https://immo-burundi-server.onrender.com/api/:splat"
  status = 200
  force = true
  [redirects.query]
    pass = true

[[redirects]]
  from = "/uploads/*"
  to = "https://immo-burundi-server.onrender.com/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/socket.io/*"
  to = "https://immo-burundi-server.onrender.com/socket.io/:splat"
  status = 200
  force = true

# ── SPA fallback ─────────────────────────────────────────────────────────
# Real files (assets, the prerendered /immobilier/* and /property/* pages,
# robots.txt, sitemap.xml) are served first, so this only catches client-side
# routes. A splat rewrite keeps the URL in the address bar, which is what the
# canonical/SEO layer expects.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Caching ──────────────────────────────────────────────────────────────
# Vite emits content-hashed filenames into /assets, so they are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Generated at build time by scripts/seo-build.mjs — never cache at the CDN.
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# index.html is the SPA entry point: it must never be cached, or clients
# keep booting an old bundle hash after a deploy.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Payload images are content-addressed by the browser cache; do not let a
# CDN re-compress them into something the API cannot revalidate.
[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Security headers ────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    # Everything is same-origin, so 'self' covers the app and the Leaflet,
    # Esri and Google Fonts assets. 'unsafe-inline' covers the inline theme
    # bootstrap and the Google Identity Services script injected at runtime.
    # flagcdn.com serves the language flag images in the header dropdown.
    # fonts.gstatic.com is already in font-src; the style-src entry is what
    # Google Translate's browser extension injects its stylesheet from.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.gstatic.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com https://res.cloudinary.com https://flagcdn.com https://*.tile.openstreetmap.org https://server.arcgisonline.com https://basemaps.cartocdn.com; connect-src 'self' https://immo-burundi-server.onrender.com wss://immo-burundi-server.onrender.com https://*.tile.openstreetmap.org https://server.arcgisonline.com https://basemaps.cartocdn.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'"
